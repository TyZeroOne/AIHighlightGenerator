# Конфигурация Prometheus для локального стека.
#
# Два источника, а не один: у API и воркера метрики принципиально разные
# и живут в разных процессах. API знает про запросы и очереди, воркер —
# про длительность этапов. Свести их в один эндпоинт можно было бы только
# через Pushgateway, а он предназначен для задач, которые живут меньше
# интервала опроса, — у нас же этапы идут минутами и опрашиваются штатно.

global:
  # 15 секунд — компромисс: этапы идут минутами, и чаще смысла нет,
  # а реже — теряется всплеск очереди перед тем, как воркер её разгребёт.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  - job_name: worker
    static_configs:
      - targets: ["worker-cpu:9100"]
        labels:
          component: worker
