# Источник данных подключается провижинингом, а не руками через UI:
# дашборд, который надо настраивать после каждого пересоздания тома,
# перестают открывать на второй раз.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
