# Продовые надстройки поверх основного compose.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Отдельный файл, а не профиль: профиль умеет только добавлять сервисы,
# а здесь нужно менять уже описанные — реплики, лимиты, доступность портов.
#
# Что здесь и почему:
#
# **Реплики API.** Он не хранит состояния, и горизонтальное масштабирование
# для него — вопрос одной строки. Воркеры не реплицируются этим файлом
# намеренно: их число выбирается по железу конкретной машины, а не по
# общему правилу.
#
# **Лимиты памяти.** Воркер, распознающий речь, держит модель в памяти,
# и без лимита один джоб на длинном файле способен утащить за собой всю
# машину через OOM-killer, который выберет жертву сам — и выберет
# не обязательно виновника.
#
# **Порты наружу.** В продовой конфигурации из контейнеров торчит только
# API. Postgres, Redis, экспортёр метрик воркера и панель Grafana доступны
# внутри сети и через VPN, но не из интернета: у них нет аутентификации,
# рассчитанной на публичный адрес.
#
# **`restart: always` вместо `unless-stopped`.** Разница проявляется после
# перезагрузки хоста: `unless-stopped` не поднимет контейнер, который
# на момент выключения был остановлен вручную, — а в проде это ровно тот
# случай, когда его как раз нужно поднять.

services:
  postgres:
    ports: !override []
    restart: always

  redis:
    ports: !override []
    restart: always

  api:
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          memory: 1g
    # Порт публикуется не напрямую: перед репликами должен стоять
    # балансировщик. Оставленный `ports` сделал бы вторую реплику
    # невозможной — порт занят первой.
    ports: !override []
    environment:
      LOG_FORMAT: json
      APP_ENV: prod
    restart: always

  worker-cpu:
    deploy:
      resources:
        limits:
          # Whisper medium в int8 занимает около 2 ГБ, плюс torch-модели
          # признаков и буферы ffmpeg. Восьми хватает с запасом на пул
          # из четырёх процессов; меньше — и OOM приходит на длинном файле.
          memory: 8g
    ports: !override []
    environment:
      LOG_FORMAT: json
      APP_ENV: prod
    restart: always

  beat:
    restart: always

  prometheus:
    ports: !override []
    restart: always

  grafana:
    ports: !override []
    environment:
      # Анонимный доступ в проде выключен: панель показывает внутреннее
      # устройство системы, и пускать в неё без пароля незачем.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    restart: always
